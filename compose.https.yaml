services:
  huoqu-proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      huoqu:
        condition: service_healthy
    ports:
      - "${CARGO_HTTPS_HTTP_PORT:-80}:80"
      - "${CARGO_HTTPS_PORT:-443}:443"
    environment:
      CARGO_HTTPS_DOMAIN: ${CARGO_HTTPS_DOMAIN:?set CARGO_HTTPS_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - huoqu_caddy_data:/data
      - huoqu_caddy_config:/config

volumes:
  huoqu_caddy_data:
  huoqu_caddy_config:
